name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [8.3, 8.4, 8.5]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.version }}
          extensions: mbstring, curl

      - name: Lint
        run: php -l src/*.php src/Cli/*.php src/Providers/*.php bin/*.php
